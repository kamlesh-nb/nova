name: CI

# Build the Nova compiler and run the 148-case conformance corpus across a native
# OS/arch matrix, and cross-produce Linux binaries via the bundled Zig toolchain (T1).
#
# HONEST STATUS (2026-07-24): only the macOS/arm64 cell is green today — it is the
# platform the toolchain is developed on. Every other cell is `experimental` (allow-fail)
# until real porting lands; each is annotated below with WHAT blocks it, so a future fix
# knows exactly what to unblock. The `cross-linux` job IS green and produces usable Linux
# x86_64 + arm64 binaries from the macOS build.

on:
  # The `soundness` job (below) runs on every push/PR on the FREE macos-arm64 runner: build with the
  # pinned+checksum-verified Zig, the full conformance corpus, and the --shadow soundness gate. The
  # heavy `build-test` matrix and `cross-compile` jobs stay MANUAL (`workflow_dispatch`) via a per-job
  # `if:` -- they include BILLED runners (Windows x2, arm64 Linux) and experimental cells with known
  # failures, so they should not fire on every commit. Run those deliberately from Actions -> CI.
  push:
  pull_request:
  workflow_dispatch:
  # Nightly: exercise the FULL 3-OS x 2-arch matrix (the billed Windows + arm64 runners) once a day
  # rather than on every commit. Experimental cells stay allow-fail, so a nightly is informational
  # until their porting blockers (documented per cell below) are cleared.
  schedule:
    - cron: "0 6 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Installed by direct tarball download from ziglang.org (see the "Install Zig" steps) rather
  # than a marketplace action — the method proven in plancks/.github/workflows/release.yaml.
  ZIG_VERSION: "0.16.0"

jobs:
  build-test:
    name: build+corpus (${{ matrix.name }})
    # Manual + NIGHTLY: billed runners + experimental cells, so not on every commit. The per-commit
    # gate is `soundness` below; the full 3-OS x 2-arch matrix runs on dispatch and once a night.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # GREEN — the development platform.
          - { name: macos-arm64, os: macos-14, experimental: false }
          # macOS x86_64: blocked by the vendored ARM64-only deps/zstd/libzstd.a and
          # deps/wolfssl/build/libwolfssl.a (arch mismatch at link). Needs x86_64 (or fat)
          # vendored static libs, or a build.zig that builds/locates them per-arch.
          - { name: macos-x86_64, os: macos-13, experimental: true }
          # Linux x86_64/arm64: the compiler links dynamic LLVM fine, but the build vendors
          # the ARM64 Mach-O deps/zstd/libzstd.a (won't link ELF) and the runtime install
          # script (build.zig) hardcodes Homebrew paths + assumes clang++/rsync. Needs a
          # Linux-portable runtime build + a Linux zstd.
          - { name: linux-x86_64, os: ubuntu-24.04, experimental: true }
          - { name: linux-arm64, os: ubuntu-24.04-arm, experimental: true }
          # Windows: the runtime's raw POSIX socket layer (sys/socket.h, netinet/in.h,
          # arpa/inet.h) needs a winsock2 port, and the sh-based install step is POSIX-only.
          - { name: windows-x86_64, os: windows-latest, experimental: true }
          - { name: windows-arm64, os: windows-11-arm, experimental: true }
    steps:
      - uses: actions/checkout@v4

      # Cache the Zig incremental build cache: on a hit, `zig build` only relinks instead of
      # recompiling the whole compiler + LLVM bindings, which is the dominant CI step. Keyed on the
      # build inputs so any source change invalidates it; restore-keys warm-start from the last build.
      - name: Cache Zig build cache
        uses: actions/cache@v4
        with:
          path: .zig-cache
          key: zigcache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**', 'deps/**/*.zig') }}
          restore-keys: |
            zigcache-${{ runner.os }}-${{ runner.arch }}-

      # Cache Homebrew downloads so `brew install llvm@21` reuses the bottle instead of refetching.
      - name: Cache Homebrew (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-${{ runner.arch }}-llvm21-boost

      - name: Install Zig (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64)   ZIG_ARCH="x86_64-linux" ;;
            Linux-aarch64)  ZIG_ARCH="aarch64-linux" ;;
            Darwin-arm64)   ZIG_ARCH="aarch64-macos" ;;
            Darwin-x86_64)  ZIG_ARCH="x86_64-macos" ;;
          esac
          curl -sL "https://ziglang.org/download/${ZIG_VERSION}/zig-${ZIG_ARCH}-${ZIG_VERSION}.tar.xz" | tar xJ
          echo "$(pwd)/zig-${ZIG_ARCH}-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Install Zig (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $arch = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'aarch64' } else { 'x86_64' }
          $url = "https://ziglang.org/download/${env:ZIG_VERSION}/zig-${arch}-windows-${env:ZIG_VERSION}.zip"
          Invoke-WebRequest -Uri $url -OutFile zig.zip
          Expand-Archive zig.zip -DestinationPath .
          "$(Get-Location)\zig-${arch}-windows-${env:ZIG_VERSION}" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Verify Zig
        run: zig version

      # Cache the LLVM (+ boost) DOWNLOADS per package manager rather than the install PREFIX: the
      # prefix lives in root-owned dirs (/usr/lib, /opt/homebrew/Cellar) that actions/cache cannot
      # restore without sudo, and brew scatters LLVM's runtime-dep dylibs across the Cellar. Caching
      # the download cache keeps the install method (and its dependency resolution) identical while
      # skipping the slow part, the multi-hundred-MB fetch. macOS uses the Homebrew cache above; the
      # two below cover Linux (.deb archives) and Windows (Chocolatey installers).
      - name: Cache apt LLVM debs (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/apt-llvm-cache
          key: apt-llvm-${{ runner.arch }}-21

      - name: Cache Chocolatey downloads (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: C:\choco-cache
          key: choco-llvm-${{ runner.arch }}

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@21 boost cmake
          echo "NOVA_LLVM_PREFIX=$(brew --prefix llvm@21)" >> "$GITHUB_ENV"
          echo "BOOST_PREFIX=$(brew --prefix boost)" >> "$GITHUB_ENV"

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          # Seed apt's archive from the user-owned cache so already-downloaded .debs are not refetched.
          mkdir -p ~/apt-llvm-cache
          sudo cp -n ~/apt-llvm-cache/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          sudo apt-get install -y llvm-21-dev libclang-21-dev clang-21 libboost-all-dev cmake zlib1g-dev
          # Save the freshly downloaded .debs back to the cache for the next run.
          cp -u /var/cache/apt/archives/*.deb ~/apt-llvm-cache/ 2>/dev/null || true
          sudo ln -sf "$(command -v clang++-21)" /usr/local/bin/clang++
          echo "NOVA_LLVM_PREFIX=/usr/lib/llvm-21" >> "$GITHUB_ENV"
          echo "BOOST_PREFIX=/usr" >> "$GITHUB_ENV"

      - name: Install deps (Windows, best-effort)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # --cache-location points Chocolatey at the cached dir so the installer is reused on a hit.
          choco install llvm cmake -y --cache-location='C:\choco-cache' || true
          echo "NOVA_LLVM_PREFIX=C:/Program Files/LLVM" >> "$GITHUB_ENV"

      - name: Build nova
        run: zig build

      - name: Conformance corpus
        shell: bash
        run: bash conformance/run.sh -j

      # SOUNDNESS GATE (L1/L2) -- run.sh --shadow bundles three checks under NOVA_SEMA_SHADOW, all now clean
      # across the corpus (0 FOUNDATION GATE failures): (a) the string ownership engine vs the resolved-TypeId
      # engine MUST agree (F5-2), (b) no UNEXPLAINED checker-vs-codegen ownership-disposition divergence
      # (F2-6 disposition -- enum/primitive recognized as safe boundaries), and (c) the F2-6 ownership-BALANCE
      # static check. (c)'s last false positives were the `let y = x` retaining-DUP shape (`let body = dechunked;
      # ...; body = f(dechunked)` and `let cw = cb; ...; cb.closeNotify()`) -- Nova is reference-counted, not
      # affine, so binding a second owned reference and reusing the first is a nova_retain DUP, not a linear
      # move; the balance model now treats it as such (src/sema/ownership.zig). This is the L1/L2 soundness gate.
      - name: Soundness gate (--shadow)
        shell: bash
        run: bash conformance/run.sh --shadow

      # FOLLOW-ON (not yet enforced): the AddressSanitizer gate (`NOVA_ASAN=1 zig build` then
      # `conformance/run.sh --asan`) catches use-after-free / double-free directly. Held out until the corpus
      # is confirmed to run --asan clean AND non-hanging from a bare clone (an environmental case stalled).

  # GREEN — the real cross-compile story: from the macOS/arm64 build, produce Linux x86_64 + arm64
  # binaries AND a Windows x86_64 .exe via the bundled Zig toolchain (T1), and upload them as artifacts.
  cross-compile:
    name: cross-compile Linux + Windows artifacts (T1)
    # Manual only (produces release artifacts); the per-commit gate is `soundness`.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Cache Zig build cache
        uses: actions/cache@v4
        with:
          path: .zig-cache
          key: zigcache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**', 'deps/**/*.zig') }}
          restore-keys: |
            zigcache-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Homebrew (macOS)
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-${{ runner.arch }}-llvm21-boost

      - name: Install Zig (pinned + checksum-verified)
        shell: bash
        run: |
          BIN="$(scripts/bootstrap-zig.sh | tail -1)"
          echo "$BIN" >> "$GITHUB_PATH"

      - name: Verify Zig
        run: zig version

      - name: Install deps (macOS)
        run: |
          brew install llvm@21 boost cmake
          echo "NOVA_LLVM_PREFIX=$(brew --prefix llvm@21)" >> "$GITHUB_ENV"
          echo "BOOST_PREFIX=$(brew --prefix boost)" >> "$GITHUB_ENV"

      - name: Build nova
        run: zig build

      - name: Cross-compile a sample to Linux x86_64 + arm64 and Windows x86_64
        run: |
          cat > /tmp/hello.nova <<'NOVA'
          struct Point { pub x: int, pub y: int }
          fn dist2(p: Point): int { return p.x * p.x + p.y * p.y; }
          fn main(): void {
              let total = 0;
              for (i in 1..=100) { total = total + i; }
              console.log(`sum 1..100 = ${total}`);
              let p = Point { x: 3, y: 4 };
              console.log(`dist2(3,4) = ${dist2(p)}`);
          }
          NOVA
          mkdir -p dist
          nova="$HOME/.nova/bin/nova"
          "$nova" /tmp/hello.nova --target linux-x86_64   -o dist/nova-hello-linux-x86_64
          "$nova" /tmp/hello.nova --target linux-arm64    -o dist/nova-hello-linux-arm64
          "$nova" /tmp/hello.nova --target windows-x86_64 -o dist/nova-hello-windows-x86_64.exe
          file dist/*
          # Assert the formats are what we expect (fail the job if a target silently regresses).
          file dist/nova-hello-linux-x86_64        | grep -q "ELF 64-bit LSB.*x86-64"
          file dist/nova-hello-linux-arm64         | grep -q "ELF 64-bit LSB.*ARM aarch64"
          file dist/nova-hello-windows-x86_64.exe  | grep -q "PE32+ executable.*x86-64"

      - name: Upload cross-compiled artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nova-cross-samples
          path: dist/

  # PER-COMMIT GATE (L4). Runs on every push/PR on the FREE macos-arm64 runner -- the green
  # development platform -- with the PINNED, checksum-verified Zig toolchain. Three gates, all
  # currently green: build, the full conformance corpus, and the --shadow soundness gate
  # (F5-2 engine-agreement + F2-6 disposition + F2-6 ownership-balance). This is NOT allow-fail:
  # a red here blocks the commit. The heavy matrix + artifact jobs above stay manual.
  soundness:
    name: soundness gate (macos-arm64, pinned Zig)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # Per-commit job: cache the pinned Zig toolchain and the incremental build cache so the common
      # path (build + corpus + shadow) is a relink, not a full rebuild. This is the hot loop for
      # contributors, so the cache pays off on every push.
      - name: Cache Zig toolchain
        uses: actions/cache@v4
        with:
          path: ~/.nova-zig
          key: zigtoolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.zig-version') }}

      - name: Cache Zig build cache
        uses: actions/cache@v4
        with:
          path: .zig-cache
          key: zigcache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**', 'deps/**/*.zig') }}
          restore-keys: |
            zigcache-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Homebrew (macOS)
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-${{ runner.arch }}-llvm21-boost

      - name: Install Zig (pinned + checksum-verified)
        shell: bash
        run: |
          BIN="$(scripts/bootstrap-zig.sh | tail -1)"
          echo "$BIN" >> "$GITHUB_PATH"

      - name: Verify Zig is the pinned version
        shell: bash
        run: |
          want="$(tr -d '[:space:]' < .zig-version)"
          got="$(zig version)"
          echo "pinned=$want running=$got"
          [ "$want" = "$got" ] || { echo "::error::Zig version drift: pinned $want, running $got"; exit 1; }

      - name: Version-sync guard (L5)
        shell: bash
        run: bash scripts/check-version-sync.sh

      - name: Install deps (macOS)
        run: |
          brew install llvm@21 boost cmake
          echo "NOVA_LLVM_PREFIX=$(brew --prefix llvm@21)" >> "$GITHUB_ENV"
          echo "BOOST_PREFIX=$(brew --prefix boost)" >> "$GITHUB_ENV"

      - name: Build nova
        run: zig build

      - name: Conformance corpus
        shell: bash
        run: bash conformance/run.sh -j

      - name: Soundness gate (--shadow)
        shell: bash
        run: bash conformance/run.sh --shadow

  # T16 -- LIVE DB integration: run integration/live_db_harness.nova against real database service
  # containers. Service containers are Linux-only (Docker), so this needs the Linux runtime build, which
  # is still experimental (see build-test notes: vendored ARM64 deps + Homebrew-path install). Until that
  # lands this job is workflow_dispatch + continue-on-error; the harness itself is complete and SKIPS every
  # driver whose DSN is unset, so it is green offline and turns each driver's live CRUD path on the moment
  # its service + DSN are present. This is the mechanism that upgrades the P0/P1 driver items (T1-T7) from
  # "code-complete" to "live-verified".
  db-integration:
    name: live DB integration harness (T16)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    continue-on-error: true            # gated on the Linux runtime build (tracked follow-on)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nova
          POSTGRES_PASSWORD: nova
          POSTGRES_DB: novadb
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U nova" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: nova
          MYSQL_DATABASE: novadb
          MYSQL_USER: nova
          MYSQL_PASSWORD: nova
        ports: [ "3306:3306" ]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -unova -pnova" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Cache Zig build cache
        uses: actions/cache@v4
        with:
          path: .zig-cache
          key: zigcache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**', 'deps/**/*.zig') }}
          restore-keys: |
            zigcache-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache apt LLVM debs (Linux)
        uses: actions/cache@v4
        with:
          path: ~/apt-llvm-cache
          key: apt-llvm-${{ runner.arch }}-21

      - name: Install Zig (pinned + checksum-verified)
        shell: bash
        run: echo "$(scripts/bootstrap-zig.sh | tail -1)" >> "$GITHUB_PATH"

      - name: Install deps (Linux)
        run: |
          sudo apt-get update
          wget -q https://apt.llvm.org/llvm.sh && chmod +x llvm.sh && sudo ./llvm.sh 21
          mkdir -p ~/apt-llvm-cache
          sudo cp -n ~/apt-llvm-cache/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          sudo apt-get install -y llvm-21-dev libclang-21-dev clang-21 libboost-all-dev cmake zlib1g-dev
          cp -u /var/cache/apt/archives/*.deb ~/apt-llvm-cache/ 2>/dev/null || true
          sudo ln -sf "$(command -v clang++-21)" /usr/local/bin/clang++
          echo "NOVA_LLVM_PREFIX=/usr/lib/llvm-21" >> "$GITHUB_ENV"
          echo "BOOST_PREFIX=/usr" >> "$GITHUB_ENV"

      # The live DB harness imports the driver packages (postgres/mysql/mssql/btreedb/mongodb), which
      # live in their OWN repos, not this one. The import resolver maps `import postgres` to
      # `packages/nova-postgres/src/postgres.nova`, so clone each driver as `packages/nova-<name>`.
      # ALL five must be present to COMPILE the harness even though only postgres+mysql have live
      # service containers here; the harness skips any driver whose DSN is unset at RUN time.
      # (The plain corpus does NOT need these: no corpus case imports a driver package.)
      # NOTE: if these repos are private, add a PAT as the `PACKAGES_TOKEN` secret; the default
      # GITHUB_TOKEN cannot read repos in another owner's account. This job is allow-fail, so a
      # missing token or repo degrades to a skip rather than breaking the gate.
      - name: Clone driver packages
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          mkdir -p packages
          auth=""
          [ -n "${GH_TOKEN:-}" ] && auth="https://x-access-token:${GH_TOKEN}@github.com/"
          for pkg in postgres mysql mssql btreedb mongodb; do
            url="https://github.com/kamlesh-nb/nova-${pkg}"
            [ -n "$auth" ] && url="${auth}kamlesh-nb/nova-${pkg}"
            git clone --depth 1 "$url" "packages/nova-${pkg}" || echo "::warning::could not clone nova-${pkg} (private without PACKAGES_TOKEN?)"
          done

      - name: Build nova
        run: zig build

      - name: Run the live DB harness (each driver's live CRUD path)
        shell: bash
        env:
          NOVA_PG_DSN: "postgres://nova:nova@127.0.0.1:5432/novadb"
          NOVA_MYSQL_DSN: "mysql://nova:nova@127.0.0.1:3306/novadb"
        run: |
          ~/.nova/bin/nova test integration/live_db_harness.nova
