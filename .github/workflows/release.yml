name: release

# Build the 4 Nova toolchain bundles -- macOS arm64, Linux {x86_64, arm64}, Windows x86_64 -- and
# publish them to a GitHub Release. (macOS Intel and Windows arm64 are NOT shipped.)
#
#   * macOS/Linux: LLVM 21 from the OS package manager (build.zig globs the install's libLLVM*.a),
#     pointed at via NOVA_LLVM_PREFIX, statically linked.
#   * Windows x86_64: DYNAMIC LLVM (Chocolatey LLVM-C); the build-windows job bundles LLVM-C.dll beside
#     nova.exe. The DLL-free static path (WIN_STATIC_LLVM_X64_URL) is a later upgrade; see CLAUDE.md.
#   * nls (the language server) IS bundled: each runner checks out the sibling `nls` repo and the
#     archive step builds it from that source, pinned to THIS lang checkout via `-Dnova-src`. nls is
#     pure-Zig (no LLVM link), so it builds on every runner without extra toolchain. If the `nls` repo
#     is private, set the `NLS_TOKEN` secret to a PAT with read access (else the checkout falls back to
#     the workflow's GITHUB_TOKEN, which only works when nls is in the same repo/owner and permitted).
#     To ship a nova-only bundle, set the repo variable `SKIP_NLS=1`.
#   * NOTE: the arm64 Linux runner is BILLED on private repos.
#
# Trigger: push a tag `v*`, or run manually (Actions -> release -> Run workflow) with a version.

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v0.1.0); names the archives"
        required: true
        default: "v0.0.0-dev"

permissions:
  contents: write

env:
  NOVA_VERSION: ${{ github.event.inputs.version || github.ref_name }}
  # Bundle nls unless the repo variable SKIP_NLS is set to 1 (archive step reads NOVA_ARCHIVE_SKIP_NLS).
  NOVA_ARCHIVE_SKIP_NLS: ${{ vars.SKIP_NLS || '0' }}

jobs:
  build-macos:
    # Apple Silicon only. macOS Intel (x86_64) is not shipped.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with: { path: lang }
      # nls (language server): checked out as a SIBLING of lang so the archive step builds it from
      # source, version-pinned to this lang checkout via -Dnova-src. Skipped only if SKIP_NLS=1.
      - uses: actions/checkout@v4
        if: ${{ vars.SKIP_NLS != '1' }}
        with:
          repository: kamlesh-nb/nls
          path: nls
          token: ${{ secrets.NLS_TOKEN || github.token }}
      - uses: mlugg/setup-zig@v2
        with: { version: 0.16.0 }
      - name: Install LLVM 21 (Homebrew) and point the build at it
        run: |
          brew install llvm@21 || brew install llvm
          PREFIX="$(brew --prefix llvm@21 2>/dev/null || brew --prefix llvm)"
          echo "NOVA_LLVM_PREFIX=$PREFIX" >> "$GITHUB_ENV"
          "$PREFIX/bin/llvm-config" --version
          # arm64 uses the vendored deps/zstd, so no Homebrew zstd is needed.
      - name: Build archive
        working-directory: lang
        run: zig build archive -Dstatic-llvm=true
      - uses: actions/upload-artifact@v4
        with:
          name: nova-macos-arm64
          path: |
            lang/zig-out/nova-*-macos-*.tar.gz
            lang/zig-out/nova-*-macos-*.tar.gz.sha256

  build-linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ ubuntu-latest, ubuntu-24.04-arm ]   # x86_64, arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with: { path: lang }
      # nls (language server): checked out as a SIBLING of lang so the archive step builds it from
      # source, version-pinned to this lang checkout via -Dnova-src. Skipped only if SKIP_NLS=1.
      - uses: actions/checkout@v4
        if: ${{ vars.SKIP_NLS != '1' }}
        with:
          repository: kamlesh-nb/nls
          path: nls
          token: ${{ secrets.NLS_TOKEN || github.token }}
      - uses: mlugg/setup-zig@v2
        with: { version: 0.16.0 }
      - name: Install LLVM 21 (apt.llvm.org) + static-link deps, point the build at it
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 21
          sudo apt-get install -y llvm-21-dev libzstd-dev zlib1g-dev libxml2-dev liblzma-dev
          echo "NOVA_LLVM_PREFIX=/usr/lib/llvm-21" >> "$GITHUB_ENV"
          /usr/lib/llvm-21/bin/llvm-config --version
          # apt's LLVM does not bundle libstdc++.so/libgcc_s.so (system libs); expose them under the
          # exact names the static link expects and point NOVA_LLVM_STDCXX_DIR at them.
          mkdir -p "$HOME/stdcxx"
          ln -sf "$(g++ -print-file-name=libstdc++.so)" "$HOME/stdcxx/libstdc++.so"
          ln -sf "$(gcc -print-file-name=libgcc_s.so.1)" "$HOME/stdcxx/libgcc_s.so"
          echo "NOVA_LLVM_STDCXX_DIR=$HOME/stdcxx" >> "$GITHUB_ENV"
      - name: Build archive
        working-directory: lang
        run: zig build archive -Dstatic-llvm=true
      - uses: actions/upload-artifact@v4
        with:
          name: nova-linux-${{ matrix.runner }}
          path: |
            lang/zig-out/nova-*-linux-*.tar.gz
            lang/zig-out/nova-*-linux-*.tar.gz.sha256

  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, arch: x64 }     # x86_64
          # windows-arm64 is NOT shipped: no arm64 Windows LLVM exists to build nova natively there,
          # and Nova has no cross-build-LLVM pipeline (the way Zig does) to produce it from another host.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with: { path: lang }
      # nls (language server): checked out as a SIBLING of lang so the archive step builds it from
      # source, version-pinned to this lang checkout via -Dnova-src. Skipped only if SKIP_NLS=1.
      - uses: actions/checkout@v4
        if: ${{ vars.SKIP_NLS != '1' }}
        with:
          repository: kamlesh-nb/nls
          path: nls
          token: ${{ secrets.NLS_TOKEN || github.token }}
      - uses: mlugg/setup-zig@v2
        with: { version: 0.16.0 }
      # DYNAMIC Windows build: link the LLVM C API (LLVM-C.dll) that Chocolatey / the official LLVM
      # Windows drop ship, rather than a self-hosted static LLVM. The resulting nova.exe needs LLVM-C.dll
      # at run time, so the bundling step below drops that DLL next to nova.exe inside the archive.
      # (The DLL-free static path -- zig build archive -Dstatic-llvm=true against a prebuilt static LLVM
      # via WIN_STATIC_LLVM_X64_URL -- is the eventual upgrade; see CLAUDE.md.)
      - name: Install LLVM (dynamic LLVM-C)
        shell: pwsh
        run: |
          function Find-Prefix {
            if (Test-Path "C:/Program Files/LLVM/lib/LLVM-C.lib") { return "C:/Program Files/LLVM" }
            $clang = Get-Command clang.exe -ErrorAction SilentlyContinue
            if ($clang) {
              $p = Split-Path (Split-Path $clang.Source)
              if (Test-Path "$p/lib/LLVM-C.lib") { return $p }
            }
            return $null
          }
          $prefix = Find-Prefix
          if (-not $prefix) {
            choco install llvm --no-progress -y
            $prefix = Find-Prefix
            if (-not $prefix) { $prefix = "C:/Program Files/LLVM" }
          }
          echo "NOVA_LLVM_PREFIX=$prefix" >> $env:GITHUB_ENV
          "$prefix/bin/llvm-config.exe" --version
      - name: Build archive (dynamic LLVM-C)
        working-directory: lang
        run: zig build archive
      - name: Bundle LLVM-C.dll into the Windows archive
        shell: pwsh
        run: |
          $zip = Get-ChildItem lang/zig-out/nova-*-windows-*.zip | Select-Object -First 1
          if (-not $zip) { Write-Error "no windows archive produced"; exit 1 }
          $dll = Join-Path $env:NOVA_LLVM_PREFIX "bin/LLVM-C.dll"
          if (-not (Test-Path $dll)) { Write-Error "LLVM-C.dll not found at $dll"; exit 1 }
          $work = "$env:RUNNER_TEMP/zipwork"
          Remove-Item -Recurse -Force $work -ErrorAction SilentlyContinue
          Expand-Archive -Path $zip.FullName -DestinationPath $work
          $exe = Get-ChildItem -Path $work -Recurse -Filter nova.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "nova.exe not found in the archive"; exit 1 }
          Copy-Item $dll (Split-Path $exe.FullName)
          Remove-Item $zip.FullName
          Compress-Archive -Path (Join-Path $work '*') -DestinationPath $zip.FullName
          # Refresh the per-file sha256 sidecar (the aggregate SHA256SUMS.txt is recomputed in the release job).
          $sha = (Get-FileHash -Algorithm SHA256 $zip.FullName).Hash.ToLower()
          "$sha  $($zip.Name)" | Set-Content -NoNewline -Path ($zip.FullName + ".sha256")
          Write-Host "bundled LLVM-C.dll beside nova.exe; sha256=$sha"
      - uses: actions/upload-artifact@v4
        with:
          name: nova-windows-${{ matrix.runner }}
          path: |
            lang/zig-out/nova-*-windows-*.zip
            lang/zig-out/nova-*-windows-*.zip.sha256

  # Publish a GitHub Release ONLY on a real version tag. A manual `workflow_dispatch` run just builds
  # and archives (the bundles are downloadable as workflow artifacts); it does not cut a release.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ build-macos, build-linux, build-windows ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Collect + checksums
        run: |
          mkdir -p out
          find dist -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \) -exec cp {} out/ \;
          ( cd out && sha256sum nova-*.tar.gz nova-*.zip 2>/dev/null > SHA256SUMS.txt || true )
          ls -la out
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NOVA_VERSION }}
          name: Nova ${{ env.NOVA_VERSION }}
          generate_release_notes: true
          files: |
            out/nova-*.tar.gz
            out/nova-*.tar.gz.sha256
            out/nova-*.zip
            out/nova-*.zip.sha256
            out/SHA256SUMS.txt
