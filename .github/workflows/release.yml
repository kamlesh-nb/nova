name: release

# Build the per-OS toolchain bundles (`zig build archive`) and publish them to a GitHub Release.
#
# WHY THIS SHAPE (every step uses a mechanism already proven in CI):
#   * Only the `nova` repo is checked out. `nls` (the language server) lives in a SEPARATE PRIVATE
#     repo, which the workflow's default GITHUB_TOKEN cannot access -- checking it out is what broke
#     the first version of this file. So CI SKIPS nls (NOVA_ARCHIVE_SKIP_NLS=1) and ships a
#     nova+runtime+stdlib bundle. nls is released from its own repo (see "nls" note at the bottom).
#   * LLVM is installed from the OS package manager (brew on macOS, apt.llvm.org on Linux) and the
#     build is pointed at it via NOVA_LLVM_PREFIX. With -Dstatic-llvm, build.zig GLOBS that install's
#     own libLLVM*.a component archives, so it works against any stock LLVM 21 -- no private mirror
#     repo, no committed lib-list upkeep. The resulting nova binary is self-contained (statically
#     links LLVM; verified locally on macOS: `otool -L` shows no libLLVM, and it compiles+runs).
#   * macOS + Linux each build their OWN bundle on their runner (a toolchain bundle must be built where
#     it runs). Windows is deferred until native `zig build` works there (stub at the bottom).
#
# Trigger: push a tag like `v0.1.0`, or run manually with a version input.

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v0.1.0); names the archives"
        required: true
        default: "v0.0.0-dev"

permissions:
  contents: write   # create the Release and upload assets on THIS repo (default token suffices)

env:
  NOVA_VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  build-macos:
    runs-on: macos-14   # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4
        with: { path: lang }   # cwd layout the archive step expects: lang/ (+ nls/ when not skipped)
      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with: { version: 0.16.0 }
      - name: Install LLVM 21 (Homebrew) and point the build at it
        run: |
          brew install llvm
          echo "NOVA_LLVM_PREFIX=$(brew --prefix llvm)" >> "$GITHUB_ENV"
          "$(brew --prefix llvm)/bin/llvm-config" --version
      - name: Build archive (static-link against the installed LLVM; nls from its own repo)
        working-directory: lang
        env: { NOVA_ARCHIVE_SKIP_NLS: "1" }
        # -Dstatic-llvm + NOVA_LLVM_PREFIX -> build.zig globs the installed LLVM's own libLLVM*.a
        # (no private mirror). Self-contained binary: nova does not dynamically link libLLVM.
        run: zig build archive -Dstatic-llvm=true
      - uses: actions/upload-artifact@v4
        with:
          name: nova-macos-aarch64
          path: |
            lang/zig-out/nova-*-macos-*.tar.gz
            lang/zig-out/nova-*-macos-*.tar.gz.sha256

  build-linux:
    runs-on: ubuntu-latest   # x86_64
    steps:
      - uses: actions/checkout@v4
        with: { path: lang }
      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with: { version: 0.16.0 }
      - name: Install LLVM 21 (apt.llvm.org) + static-link deps, point the build at it
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 21
          sudo apt-get install -y llvm-21-dev libzstd-dev zlib1g-dev libxml2-dev
          echo "NOVA_LLVM_PREFIX=/usr/lib/llvm-21" >> "$GITHUB_ENV"
          /usr/lib/llvm-21/bin/llvm-config --version
          ls /usr/lib/llvm-21/lib/libLLVM*.a | head -3   # confirm static component archives are present
      - name: Build archive (static-link against the installed LLVM; nls from its own repo)
        working-directory: lang
        env: { NOVA_ARCHIVE_SKIP_NLS: "1" }
        # -Dstatic-llvm + NOVA_LLVM_PREFIX -> build.zig globs /usr/lib/llvm-21/lib/libLLVM*.a
        # (no private mirror). Self-contained binary: nova does not dynamically link libLLVM.
        run: zig build archive -Dstatic-llvm=true
      - uses: actions/upload-artifact@v4
        with:
          name: nova-linux-x86_64
          path: |
            lang/zig-out/nova-*-linux-*.tar.gz
            lang/zig-out/nova-*-linux-*.tar.gz.sha256

  # BEST-EFFORT: native Windows `zig build` is the current bring-up frontier and is NOT yet
  # run-verified (the install step + LLVM link on a bare Windows host). continue-on-error means a
  # failure here does NOT block the mac/linux release; when the bring-up lands, this job goes green
  # and its artifact is picked up automatically. On Windows the compiler DYNAMICALLY links LLVM-C
  # (there is no static path there), so LLVM is installed via Chocolatey and LLVM-C.dll is bundled
  # next to nova.exe by the archive step.
  build-windows:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { path: lang }
      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with: { version: 0.16.0 }
      - name: Install LLVM (Chocolatey) and point the build at it
        shell: pwsh
        run: |
          choco install llvm --no-progress -y
          $prefix = "C:/Program Files/LLVM"
          echo "NOVA_LLVM_PREFIX=$prefix" >> $env:GITHUB_ENV
          & "$prefix/bin/llvm-config.exe" --version
          # dynamic link needs the import lib; report whether it is present (dev files vary by package)
          Test-Path "$prefix/lib/LLVM-C.lib" | ForEach-Object { Write-Host "LLVM-C.lib present: $_" }
      - name: Build archive (dynamic LLVM-C; nls from its own repo)
        working-directory: lang
        env: { NOVA_ARCHIVE_SKIP_NLS: "1" }
        run: zig build archive   # NOT -Dstatic-llvm: Windows uses the dynamic LLVM-C path
      - uses: actions/upload-artifact@v4
        with:
          name: nova-windows-x86_64
          path: |
            lang/zig-out/nova-*-windows-*.zip
            lang/zig-out/nova-*-windows-*.zip.sha256

  release:
    # build-windows is included so the release WAITS for it, but it is continue-on-error, so a
    # Windows failure does not block the release -- mac/linux still ship, windows joins when it works.
    needs: [ build-macos, build-linux, build-windows ]
    runs-on: ubuntu-latest
    steps:
      - name: Download all archives
        uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Flatten + combined checksums
        run: |
          mkdir -p out
          find dist -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \) -exec cp {} out/ \;
          # checksum whatever archives actually arrived (windows may be absent)
          ( cd out && sha256sum nova-*.tar.gz nova-*.zip 2>/dev/null > SHA256SUMS.txt || true )
          ls -la out
      - name: Publish GitHub Release (uploads via the gh-backed action)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NOVA_VERSION }}
          name: Nova ${{ env.NOVA_VERSION }}
          generate_release_notes: true
          fail_on_unmatched_files: false   # windows .zip may be absent
          files: |
            out/nova-*.tar.gz
            out/nova-*.tar.gz.sha256
            out/nova-*.zip
            out/nova-*.zip.sha256
            out/SHA256SUMS.txt

  # ---------------------------------------------------------------------------------------------
  # nls (language server): NOT built here. It is a separate PRIVATE repo (kamlesh-nb/nls) whose
  # build links LLVM its own way and cannot use -Dstatic-llvm. To include it in releases, either:
  #   (a) add a release workflow to the nls repo that runs `zig build` + uploads nova-nls-<os>-<arch>,
  #       OR
  #   (b) grant this workflow read access to nls (a fine-grained PAT stored as secret NLS_TOKEN),
  #       add `actions/checkout` of kamlesh-nb/nls with `token: ${{ secrets.NLS_TOKEN }}` into a
  #       sibling `nls/` dir, drop NOVA_ARCHIVE_SKIP_NLS, and provision LLVM for the nls link.
