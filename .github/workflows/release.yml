name: release

# Build the 5 Nova toolchain bundles -- macOS {arm64, x86_64}, Linux {x86_64, arm64}, Windows x86_64 --
# and publish them to a GitHub Release. (Windows arm64 is NOT shipped; see the build-windows job.)
#
#   * macOS/Linux: LLVM 21 from the OS package manager (build.zig globs the install's libLLVM*.a),
#     pointed at via NOVA_LLVM_PREFIX, statically linked.
#   * Windows x86_64: STATIC LLVM from a self-hosted prebuilt (build-windows job), so nova.exe carries
#     no LLVM-C.dll. See the "Releasing a static, DLL-free Windows nova.exe" section in CLAUDE.md.
#   * nls (the language server) IS bundled: each runner checks out the sibling `nls` repo and the
#     archive step builds it from that source, pinned to THIS lang checkout via `-Dnova-src`. nls is
#     pure-Zig (no LLVM link), so it builds on every runner without extra toolchain. If the `nls` repo
#     is private, set the `NLS_TOKEN` secret to a PAT with read access (else the checkout falls back to
#     the workflow's GITHUB_TOKEN, which only works when nls is in the same repo/owner and permitted).
#     To ship a nova-only bundle, set the repo variable `SKIP_NLS=1`.
#   * NOTE: the arm64 Linux runner is BILLED on private repos.
#
# Trigger: push a tag `v*`, or run manually (Actions -> release -> Run workflow) with a version.

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v0.1.0); names the archives"
        required: true
        default: "v0.0.0-dev"

permissions:
  contents: write

env:
  NOVA_VERSION: ${{ github.event.inputs.version || github.ref_name }}
  # Bundle nls unless the repo variable SKIP_NLS is set to 1 (archive step reads NOVA_ARCHIVE_SKIP_NLS).
  NOVA_ARCHIVE_SKIP_NLS: ${{ vars.SKIP_NLS || '0' }}

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [ macos-14, macos-13 ]   # arm64, x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with: { path: lang }
      # nls (language server): checked out as a SIBLING of lang so the archive step builds it from
      # source, version-pinned to this lang checkout via -Dnova-src. Skipped only if SKIP_NLS=1.
      - uses: actions/checkout@v4
        if: ${{ vars.SKIP_NLS != '1' }}
        with:
          repository: kamlesh-nb/nls
          path: nls
          token: ${{ secrets.NLS_TOKEN || github.token }}
      - uses: mlugg/setup-zig@v2
        with: { version: 0.16.0 }
      - name: Install LLVM 21 (Homebrew) and point the build at it
        run: |
          brew install llvm@21 || brew install llvm
          PREFIX="$(brew --prefix llvm@21 2>/dev/null || brew --prefix llvm)"
          echo "NOVA_LLVM_PREFIX=$PREFIX" >> "$GITHUB_ENV"
          "$PREFIX/bin/llvm-config" --version
          # The vendored deps/zstd is arm64-only; the x86_64 (macos-13) leg links a Homebrew zstd.
          brew install zstd
          echo "NOVA_ZSTD_PREFIX=$(brew --prefix zstd)" >> "$GITHUB_ENV"
      - name: Build archive
        working-directory: lang
        run: zig build archive -Dstatic-llvm=true
      - uses: actions/upload-artifact@v4
        with:
          name: nova-macos-${{ matrix.runner }}   # unique per leg; the filename encodes the real arch
          path: |
            lang/zig-out/nova-*-macos-*.tar.gz
            lang/zig-out/nova-*-macos-*.tar.gz.sha256

  build-linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ ubuntu-latest, ubuntu-24.04-arm ]   # x86_64, arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with: { path: lang }
      # nls (language server): checked out as a SIBLING of lang so the archive step builds it from
      # source, version-pinned to this lang checkout via -Dnova-src. Skipped only if SKIP_NLS=1.
      - uses: actions/checkout@v4
        if: ${{ vars.SKIP_NLS != '1' }}
        with:
          repository: kamlesh-nb/nls
          path: nls
          token: ${{ secrets.NLS_TOKEN || github.token }}
      - uses: mlugg/setup-zig@v2
        with: { version: 0.16.0 }
      - name: Install LLVM 21 (apt.llvm.org) + static-link deps, point the build at it
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 21
          sudo apt-get install -y llvm-21-dev libzstd-dev zlib1g-dev libxml2-dev liblzma-dev
          echo "NOVA_LLVM_PREFIX=/usr/lib/llvm-21" >> "$GITHUB_ENV"
          /usr/lib/llvm-21/bin/llvm-config --version
          # apt's LLVM does not bundle libstdc++.so/libgcc_s.so (system libs); expose them under the
          # exact names the static link expects and point NOVA_LLVM_STDCXX_DIR at them.
          mkdir -p "$HOME/stdcxx"
          ln -sf "$(g++ -print-file-name=libstdc++.so)" "$HOME/stdcxx/libstdc++.so"
          ln -sf "$(gcc -print-file-name=libgcc_s.so.1)" "$HOME/stdcxx/libgcc_s.so"
          echo "NOVA_LLVM_STDCXX_DIR=$HOME/stdcxx" >> "$GITHUB_ENV"
      - name: Build archive
        working-directory: lang
        run: zig build archive -Dstatic-llvm=true
      - uses: actions/upload-artifact@v4
        with:
          name: nova-linux-${{ matrix.runner }}
          path: |
            lang/zig-out/nova-*-linux-*.tar.gz
            lang/zig-out/nova-*-linux-*.tar.gz.sha256

  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, arch: x64 }     # x86_64
          # windows-arm64 is NOT shipped: no arm64 Windows LLVM exists to build nova natively there,
          # and Nova has no cross-build-LLVM pipeline (the way Zig does) to produce it from another host.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with: { path: lang }
      # nls (language server): checked out as a SIBLING of lang so the archive step builds it from
      # source, version-pinned to this lang checkout via -Dnova-src. Skipped only if SKIP_NLS=1.
      - uses: actions/checkout@v4
        if: ${{ vars.SKIP_NLS != '1' }}
        with:
          repository: kamlesh-nb/nls
          path: nls
          token: ${{ secrets.NLS_TOKEN || github.token }}
      - uses: mlugg/setup-zig@v2
        with: { version: 0.16.0 }
      # A static, DLL-free nova.exe links the STATIC LLVM component libs (LLVM*.lib), which Chocolatey
      # and the official LLVM-C Windows drop do NOT ship -- they ship only LLVM-C.dll + its import lib.
      # So we fetch a self-hosted prebuilt static LLVM (build it once locally per arch; see the
      # "Releasing a static, DLL-free Windows nova.exe" section in CLAUDE.md), pointed at by these repo
      # variables. Cached across runs on the extraction dir so the ~1GB download happens once per URL.
      - name: Cache static LLVM
        uses: actions/cache@v4
        with:
          path: C:\llvm-static
          key: winllvm-${{ matrix.arch }}-${{ hashFiles('build.zig.zon') }}-${{ vars.WIN_STATIC_LLVM_X64_URL }}${{ vars.WIN_STATIC_LLVM_ARM64_URL }}
      - name: Fetch prebuilt static LLVM and point the build at it
        shell: pwsh
        env:
          URL_X64: ${{ vars.WIN_STATIC_LLVM_X64_URL }}
          URL_ARM64: ${{ vars.WIN_STATIC_LLVM_ARM64_URL }}
        run: |
          $dest = "C:\llvm-static"
          $existing = Get-ChildItem -Path $dest -Recurse -Filter LLVMCore.lib -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $existing) {
            $url = if ("${{ matrix.arch }}" -eq "arm64") { $env:URL_ARM64 } else { $env:URL_X64 }
            if (-not $url) {
              Write-Error "No prebuilt static LLVM URL for ${{ matrix.arch }}. Set repo variable WIN_STATIC_LLVM_$(('${{ matrix.arch }}').ToUpper())_URL to a static LLVM 22 build (BUILD_SHARED_LIBS=OFF; zlib/zstd/libxml2/terminfo OFF). See CLAUDE.md."
              exit 1
            }
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            $file = "$env:RUNNER_TEMP\llvm-static" + [System.IO.Path]::GetExtension($url)
            Write-Host "Downloading static LLVM: $url"
            Invoke-WebRequest -Uri $url -OutFile $file
            if ($file -match '\.zip$') { Expand-Archive -Force -Path $file -DestinationPath $dest }
            else { tar -xf $file -C $dest }   # tar ships with Windows and reads .tar.xz / .tar.gz
            $existing = Get-ChildItem -Path $dest -Recurse -Filter LLVMCore.lib -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $existing) { Write-Error "extracted archive has no lib/LLVMCore.lib -- not a static LLVM build"; exit 1 }
          $prefix = $existing.Directory.Parent.FullName   # <prefix>/lib/LLVMCore.lib -> <prefix>
          echo "NOVA_LLVM_PREFIX=$prefix" >> $env:GITHUB_ENV
          Write-Host "NOVA_LLVM_PREFIX=$prefix"
          # A pure static build has NO LLVM-C.lib/.dll; warn if one leaked in (the build.zig glob skips it).
          Write-Host ("LLVM-C.lib present (expected absent): " + (Test-Path "$prefix/lib/LLVM-C.lib"))
      - name: Build archive (static LLVM; self-contained, no LLVM-C.dll)
        working-directory: lang
        run: zig build archive -Dstatic-llvm=true
      - uses: actions/upload-artifact@v4
        with:
          name: nova-windows-${{ matrix.runner }}
          path: |
            lang/zig-out/nova-*-windows-*.zip
            lang/zig-out/nova-*-windows-*.zip.sha256

  release:
    needs: [ build-macos, build-linux, build-windows ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Collect + checksums
        run: |
          mkdir -p out
          find dist -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \) -exec cp {} out/ \;
          ( cd out && sha256sum nova-*.tar.gz nova-*.zip 2>/dev/null > SHA256SUMS.txt || true )
          ls -la out
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NOVA_VERSION }}
          name: Nova ${{ env.NOVA_VERSION }}
          generate_release_notes: true
          files: |
            out/nova-*.tar.gz
            out/nova-*.tar.gz.sha256
            out/nova-*.zip
            out/nova-*.zip.sha256
            out/SHA256SUMS.txt
