name: db-integration

# Live DB integration: build nova on Linux, clone the driver packages, and run the live-DB harness
# (integration/live_db_harness.nova) against real database service containers. The harness skips any
# driver whose DSN is unset, so it is green offline and lights up each driver's CRUD path when its
# service + DSN are present. Manual + nightly (uses billed service containers).

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  live-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nova
          POSTGRES_PASSWORD: nova
          POSTGRES_DB: novadb
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U nova" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: nova
          MYSQL_DATABASE: novadb
          MYSQL_USER: nova
          MYSQL_PASSWORD: nova
        ports: [ "3306:3306" ]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -unova -pnova" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cache Zig build cache
        uses: actions/cache@v4
        with:
          path: .zig-cache
          key: zigcache-linux-x86_64-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**', 'deps/**/*.zig') }}
          restore-keys: |
            zigcache-linux-x86_64-

      - name: Cache apt LLVM debs
        uses: actions/cache@v4
        with:
          path: ~/apt-llvm-cache
          key: apt-llvm-linux-x86_64-21

      - name: Install LLVM 21 + Boost
        run: |
          sudo apt-get update
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 21
          mkdir -p ~/apt-llvm-cache
          sudo cp -n ~/apt-llvm-cache/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          sudo apt-get install -y llvm-21-dev libclang-21-dev clang-21 libboost-all-dev cmake zlib1g-dev
          cp -u /var/cache/apt/archives/*.deb ~/apt-llvm-cache/ 2>/dev/null || true
          sudo ln -sf "$(command -v clang++-21)" /usr/local/bin/clang++
          echo "NOVA_LLVM_PREFIX=/usr/lib/llvm-21" >> "$GITHUB_ENV"
          echo "BOOST_PREFIX=/usr" >> "$GITHUB_ENV"

      # The harness imports the driver packages (postgres/mysql/mssql/btreedb/mongodb), which live in
      # their own public repos. The resolver maps `import postgres` to packages/nova-postgres/src/
      # postgres.nova, so clone each as packages/nova-<name>. All five are needed to COMPILE even
      # though only postgres+mysql have live service containers here.
      - name: Package cache bucket
        id: pkgbucket
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache driver packages
        uses: actions/cache@v4
        with:
          path: packages
          key: driver-packages-${{ steps.pkgbucket.outputs.week }}

      - name: Clone driver packages
        run: |
          mkdir -p packages
          for pkg in postgres mysql mssql btreedb mongodb; do
            [ -d "packages/nova-${pkg}/.git" ] && { echo "nova-${pkg}: cached"; continue; }
            git clone --depth 1 "https://github.com/kamlesh-nb/nova-${pkg}" "packages/nova-${pkg}" \
              || echo "::warning::could not clone nova-${pkg}"
          done

      - name: Build nova
        run: zig build

      - name: Run the live DB harness
        env:
          NOVA_PG_DSN: "postgres://nova:nova@127.0.0.1:5432/novadb"
          NOVA_MYSQL_DSN: "mysql://nova:nova@127.0.0.1:3306/novadb"
        run: ~/.nova/bin/nova test integration/live_db_harness.nova
