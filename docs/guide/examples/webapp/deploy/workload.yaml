# The FINALISED deploy manifest for this Kyte web app. It tells the orchestrator how to RUN the app
# (binary by hash, replicas, load balancing, health, exposure). It does NOT carry the app's own
# configuration: Kyte keeps that file-based and outside the orchestrator. The app reads its settings from
# an `app.yaml` at the project root through `app.config` (see Chapter 18); orchd never injects config as
# environment variables, because co-located apps would collide on the same names. Commit this in your
# repo; the deploy action fills in the artifact digest and writes it to the orchestrator, which
# reconciles from it.
apiVersion: kyte/v1
kind: App
metadata:
  name: webapp
workload:
  # The deploy action replaces the placeholder below with the digest of the binary it just uploaded, so
  # the manifest names the exact bytes orchd should pull and run. For a local path instead, use `binary:`.
  artifact: sha256:__ARTIFACT__
  # Operational arguments orchd passes to each replica. `--config <profile>` selects the app.yaml profile
  # the app loads; the port is injected per replica (see network.portFlag below).
  args:
    - --config
    - prod
  restartPolicy: always
replicas:
  min: 2
  max: 6
lb:
  strategy: roundrobin
  handoff: false
network:
  expose: public
  portBase: 8080          # replica i binds 8080 + i; orchd passes the port per replica
  portFlag: --port
  servicePort: 8090       # the front port `service` load-balances on
health:
  path: /healthz
  intervalMs: 2000
  timeoutMs: 1000
  rise: 2
  fall: 3
