# The FINALISED manifest for this Nova web app: one file, the single source of truth. It tells the
# orchestrator how to run the app (binary by hash, replicas, load balancing, health, exposure) AND
# configures the app itself (the `config:` block, injected into every replica as environment variables
# that src/appconfig.nova reads back). Commit this in your repo; the deploy action fills in the artifact
# digest and writes it to the orchestrator, which reconciles from it.
apiVersion: nova/v1
kind: App
metadata:
  name: webapp
workload:
  # The deploy action replaces the placeholder below with the digest of the binary it just uploaded, so
  # the manifest names the exact bytes orchd should pull and run. For a local path instead, use `binary:`.
  artifact: sha256:__ARTIFACT__
  restartPolicy: always
replicas:
  min: 2
  max: 6
lb:
  strategy: roundrobin
  handoff: false
network:
  expose: public
  portBase: 8080          # replica i binds 8080 + i; orchd injects NOVA_PORT per replica
  portFlag: --port
  servicePort: 8090       # the front port `service` load-balances on
health:
  path: /healthz
  intervalMs: 2000
  timeoutMs: 1000
  rise: 2
  fall: 3
# App configuration, env-file style (KEY=VALUE). Each entry becomes an environment variable in every
# replica; the app reads them via AppConfig (src/appconfig.nova). This is the "same manifest configures
# the app" half. Split on the first '=', so a value may itself contain '='.
config:
  - LOG_LEVEL=info
  - DB_URL=novadb://127.0.0.1:8135?db=shop
